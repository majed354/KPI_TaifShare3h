<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>معاينة أنواع الاستطلاعات</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="main">
    <section class="card">
        <h3>معاينة تمييز استطلاع العينة</h3>
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-num">KPI-1</div>
                <div class="kpi-body">
                    <div class="kpi-name">تقويم الطلاب لجودة خبرات التعلم في البرنامج</div>
                    <div class="kpi-val">4.42 <span class="kpi-unit">درجة</span></div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-num">KPI-6</div>
                <div class="kpi-body">
                    <div class="kpi-name">توظيف الخريجين أو التحاقهم بالدراسات العليا</div>
                    <div class="kpi-val">42.9% <span class="kpi-unit">%</span></div>
                    <div class="kpi-survey-meta">
                        <span class="kpi-survey-badge sample">استطلاع عينة</span>
                        <span class="kpi-survey-count">عدد المشاركين: ٧</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
